name: BUSKIT Windows x64

on:
  workflow_dispatch:
  push:
    branches: [feat/buskit-soporte-remoto]
    paths-ignore: ['**.md', 'buskit/brand/**']

permissions:
  contents: read

concurrency:
  group: buskit-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.75'
  FLUTTER_VERSION: '3.24.5'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_CMAKE_VERSION: '4.3.0'
  VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-cache,readwrite'

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml
  window-helper:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
  windows:
    needs: [bridge, window-helper]
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        id: flutter
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Flutter engine compatible with upstream 1.5.0
        shell: pwsh
        run: |
          flutter precache --windows
          if ($LASTEXITCODE) { throw 'Flutter precache failed' }
          Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile engine.zip
          Get-FileHash engine.zip -Algorithm SHA256
          Expand-Archive engine.zip engine
          $engineTarget = Join-Path '${{ steps.flutter.outputs.CACHE-PATH }}' 'bin/cache/artifacts/engine/windows-x64-release'
          Copy-Item engine/* $engineTarget -Recurse -Force
      - name: Apply upstream Flutter patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$PWD/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$patch"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: buskit-windows-x64
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Cache native libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: C:\vcpkg-cache
          key: buskit-vcpkg-windows-2022-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'res/vcpkg/**') }}
      - name: Install native libraries
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - name: Compile application
        shell: pwsh
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE) { throw 'Application build failed' }
          Move-Item flutter/build/windows/x64/runner/Release rustdesk
          Rename-Item rustdesk/rustdesk.exe BUSKITSoporteRemoto.exe
          Copy-Item LICENCE rustdesk/LICENCE
          Copy-Item buskit/LICENSE-NOTICE.txt rustdesk/LICENSE-NOTICE.txt
          Copy-Item buskit/GUIA-WINDOWS.md rustdesk/GUIA-WINDOWS.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: rustdesk
      - name: Package portable EXE
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/dpiAware/d' res/manifest.xml
          cd libs/portable
          pip install -r requirements.txt
          python generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/BUSKITSoporteRemoto.exe -l 8
          cd ../..
          mkdir -p dist/installer
          cp target/release/rustdesk-portable-packer.exe dist/installer/BUSKIT-Soporte-Remoto.exe
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Package MSI
        shell: pwsh
        run: |
          Push-Location res/msi
          python preprocess.py --app-name BUSKITSoporteRemoto --manufacturer BUSKIT --version 1.5.0 --revision-version 1 -d ../../rustdesk
          if ($LASTEXITCODE) { throw 'MSI preprocessing failed' }
          Copy-Item ../../buskit/License.rtf Package/License.rtf -Force
          nuget restore msi.sln
          if ($LASTEXITCODE) { throw 'NuGet restore failed' }
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          if ($LASTEXITCODE) { throw 'MSI build failed' }
          $msi = Get-ChildItem Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI artifact missing' }
          Copy-Item $msi.FullName ../../dist/installer/BUSKIT-Soporte-Remoto.msi
          Pop-Location
      - name: Package source, notices and checksums
        shell: pwsh
        run: |
          Copy-Item buskit/GUIA-WINDOWS.md,buskit/LICENSE-NOTICE.txt,LICENCE dist/installer/
          git archive --format=tar --output=source-main.tar HEAD
          git -C libs/hbb_common archive --format=tar --prefix=libs/hbb_common/ --output=../../source-common.tar HEAD
          New-Item -ItemType Directory source-package | Out-Null
          tar -xf source-main.tar -C source-package
          tar -xf source-common.tar -C source-package
          Compress-Archive source-package/* dist/installer/BUSKIT-Soporte-Remoto-source.zip
          Get-ChildItem dist/installer -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: BUSKIT-Soporte-Remoto-Windows-x64
          path: dist/installer/
          retention-days: 3
          if-no-files-found: error
